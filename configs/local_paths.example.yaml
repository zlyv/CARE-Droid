version: "1.0.0"

# 截图中的服务器数据根目录。若实际路径不同，只修改此处。
dataset_root: "/android/AndroZoo"

sources:
  - id: "legacy_packed_small"
    enabled: true
    purpose: "feasibility_only"
    declared_pack_state: "mixed_or_packed"
    apk_roots:
      - "apks"
    list_roots:
      - "lists"

  - id: "new_nonpacked_2017_2021"
    enabled: true
    purpose: "formal_candidate_after_p0"
    declared_pack_state: "unpacked"
    apk_roots:
      - "apks_new_nonpacked_2017_2021_b200_t100_20260731_210203"
    list_roots:
      - "lists_new_nonduplicate_2017_2021"

scan:
  extensions: [".apk"]

  # 年份和标签只在“相对于 apk_root 的路径”中推断，避免把数据源目录
  # 名称中的 b200/t100 错当成每个 APK 的标签。
  year_regex: "(?<![0-9])(2017|2018|2019|2020|2021)(?![0-9])"
  label_rules:
    malicious:
      - "(^|[/_-])(malware|malicious|positive|virus)([/_.-]|$)"
    benign:
      - "(^|[/_-])(benign|negative|clean)([/_.-]|$)"


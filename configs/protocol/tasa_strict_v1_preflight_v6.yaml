version: "1.0.0-preflight-v6"
run_status:
  phase: "preflight"
  formal_training_enabled: false
  block_reason:
    - "P0 audit has not supplied real 2017-2021 cluster counts and coverage."
    - "The final resolved hyperparameter file has not been generated by nested validation."
protocol:
  document_mode: "strict_doc"
  knowledge_cutoff_utc: "2017-12-31T23:59:59Z"
  main_result_protocol: "strict_doc"
  practical_doc_is_supplementary: true
time_windows:
  scheme: "calendar_quarter"
  timezone: "UTC"
  boundaries:
    Q1: ["01-01", "03-31"]
    Q2: ["04-01", "06-30"]
    Q3: ["07-01", "09-30"]
    Q4: ["10-01", "12-31"]
  timestamp_field: "audited_first_seen_utc"
  allow_file_mtime_fallback: false
  minimum_valid_windows_per_api: 3
  minimum_app_support_per_class_per_window: 5
numerics:
  epsilon: 1.0e-8
graph:
  node_granularity: "merge_by_full_api_signature_per_apk"
  H_grid: [2, 4, 6, 8]
  K_out_grid: [8, 16, 32, 64]
  P_cap_grid: [4, 8, 16]
  E_cap_grid: [2000, 5000, 10000, 20000]
  path_dedup_key: "sha256(ordered_internal_method_signatures_and_edge_types)"
  retained_path_sort:
    - "hop_asc"
    - "icc_any_desc"
    - "reflection_any_desc"
    - "path_hash_asc"
  edge_flag_aggregation:
    icc_any: "logical_or_over_retained_canonical_paths"
    reflection_any: "logical_or_over_retained_canonical_paths"
    path_count: "min(number_of_retained_unique_paths, P_cap)"
    flags_truncated: "true_when_candidate_unique_paths_exceed_P_cap"
  sensitive_endpoint_priority_file: "sensitive_endpoint_priority_v1.yaml"
augmentation:
  deterministic_view_seed: "uint32(sha256(global_seed|epoch|apk_sha256|view_type)[0:8])"
  resample_each_epoch: true
  stable_within_epoch: true
  validation_or_test_augmentation: false
  identity_fallback:
    mode: "zero_projected_id"
    application_point: "after_id_projection_before_reliability_scaling"
    eligible_nodes: "in_vocab_and_r_greater_than_r_min"
    sample_without_replacement: true
    sampling_weight: "(1-r_a)+epsilon"
    node_ratio: 0.20
    minimum_nodes: 1
    maximum_nodes: 64
    views_per_graph_A4: 1
    views_per_graph_A5: 1
  official_replacement:
    relation_source: "strict_doc_official_deprecated_to_replacement_only"
    minimum_relation_confidence: 0.90
    eligible_nodes: "passes_role_permission_data_contract_checks"
    sample_without_replacement: true
    sampling_weight: "(1-r_a)+epsilon"
    node_ratio: 0.15
    minimum_nodes_when_eligible: 1
    maximum_nodes: 3
    views_per_graph_A5: 1
    target_selection: "highest_confidence_then_target_signature_lexicographic"
    replacement_view_composition: "start_from_original_A3_Full_graph_without_identity_fallback"
    no_eligible_node_action: "skip_replacement_loss_for_graph_and_log_reason"
  views:
    A4: ["original", "identity_fallback"]
    A5: ["original", "identity_fallback", "official_replacement"]
reliability:
  A3_MVP_components: ["D", "T", "one_minus_F"]
  A3_Full_components: ["D", "T", "C", "S", "one_minus_F", "Q"]
  r_min_grid: [0.05, 0.10, 0.15]
  r_max_grid: [0.90, 0.95, 1.00]
  alpha_prior_grid: [0.5, 1.0, 2.0]
  kappa_support_grid: [10, 20, 50]
  kappa_context_grid: [10, 20, 50]
  weight_search: "nonnegative_simplex_nested_validation"
validation:
  alpha_val_grid: [0.5, 1.0, 2.0]
  beta_val_grid: [0.0, 0.25, 0.5]
  grouped_oof_folds: 5
statistics:
  seeds: [0, 1, 2, 3, 4]
  bootstrap_replicates: 2000
  p0_planning_half_width: 0.05
  metric_ci_half_width: 0.03
  rate_ci_half_width: 0.04
  paired_delta_f1_half_width: 0.025
formal_resolution_gate:
  required_files:
    - "p0_audit.json"
    - "data_manifest.sha256"
    - "split_manifest.sha256"
    - "semantic_mapping.sha256"
    - "sdk_docs_manifest.sha256"
    - "sensitive_endpoint_priority_v1.yaml"
  required_actions:
    - "resolve all grid-selected values by the preregistered nested-validation rule"
    - "write configs/tasa_strict_v1.resolved.yaml with no null, placeholder, or unresolved token"
    - "set formal_training_enabled=true only after P0 confirmatory-year eligibility is recorded"
    - "compute SHA256 of the resolved config and copy it into every run directory"

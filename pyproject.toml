[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasa-droid"
version = "0.1.5"
description = "TASA-Droid temporal Android malware detection research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
tasa-droid = "tasa_droid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
